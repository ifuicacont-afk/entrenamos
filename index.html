<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0E1319" />
    <meta name="description" content="Entrenamiento y alimentación para Ignacio y Linda" />
    <!-- Para que al agregarla a la pantalla de inicio se abra sin barra del navegador -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Entrenamos" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Entrenamos</title>

    <!-- Se aplica el tema ANTES de pintar nada. Sin esto, abrir la app
         en modo oscuro muestra un destello blanco de un cuadro. -->
    <script>
      (function () {
        try {
          var m = localStorage.getItem("entrenamos:tema") || "auto";
          var oscuro =
            m === "oscuro" ||
            (m === "auto" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          var tema = oscuro ? "dark" : "light";
          document.documentElement.setAttribute("data-theme", tema);
          document.documentElement.setAttribute("data-lane", "ignacio");
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute("content", oscuro ? "#0B0F14" : "#F1F4FA");

          /* El color elegido, también antes de pintar. Si no, la app
             abre con el color del plan y cambia al del usuario a los
             pocos milisegundos: se ve como un parpadeo. */
          var P = {
            naranjo:  ["#FF7A45", "#EA580C"], turquesa: ["#3FD0C9", "#0E9E96"],
            azul:     ["#60A5FA", "#2563EB"], violeta:  ["#A78BFA", "#7C3AED"],
            fucsia:   ["#E879F9", "#C026D3"], rosa:     ["#FB7185", "#E11D48"],
            verde:    ["#4ADE80", "#15A34A"], ambar:    ["#FBBF24", "#B45309"]
          };
          var elegido = P[localStorage.getItem("entrenamos:color")];
          if (elegido) {
            var hex = oscuro ? elegido[0] : elegido[1];
            var n = parseInt(hex.slice(1), 16);
            var rgb = ((n >> 16) & 255) + "," + ((n >> 8) & 255) + "," + (n & 255);
            var e = document.documentElement.style;
            e.setProperty("--accent", hex);
            e.setProperty("--accent-soft", "rgba(" + rgb + "," + (oscuro ? 0.15 : 0.12) + ")");
            e.setProperty("--accent-glow", "rgba(" + rgb + "," + (oscuro ? 0.32 : 0.28) + ")");
          }
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
